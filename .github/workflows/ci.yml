name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug project root
        run: |
          echo "PWD: $(pwd)"
          find . -name "pubspec.yaml" -not -path "*/build/*" | head -5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib

      - name: Install xvfb for widget tests
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Tests with xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" flutter test --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: analyze-and-test
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug project root
        run: |
          echo "PWD: $(pwd)"
          find . -name "pubspec.yaml" -not -path "*/build/*" | head -5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Show build output
        if: always()
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "NO APK DIR"
          find . -name "*.apk" -not -path "*/.dart_tool/*" | head -20

      - name: Normalize APK location
        if: always()
        run: |
          mkdir -p build/app/outputs/flutter-apk
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            found=$(find . -name "app-release.apk" -not -path "*/.dart_tool/*" | head -1)
            if [ -n "$found" ]; then cp "$found" build/app/outputs/flutter-apk/app-release.apk; fi
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: warn
          retention-days: 30

  deploy-web:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-android
    if: github.repository == 'MatheussPrata/Jogoflutter' && github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter config --enable-web
          flutter build web --release --base-href="/Jogoflutter/" --verbose
          echo "Build completed, checking output..."
          ls -la build/
          ls -la build/web/ || echo "build/web does not exist"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
