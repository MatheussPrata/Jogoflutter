name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup, Get Dependencies and Build APK
        run: |
          # 1. Encontra o diretório exato que contém o pubspec.yaml
          PROJECT_PATH=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "O pubspec.yaml foi encontrado na pasta: $PROJECT_PATH"
          
          # 2. Entra no diretório
          cd "$PROJECT_PATH"
          
          # 3. Baixa as dependências e faz o build
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_quest/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK (all ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-split
          path: flutter_quest/build/app/outputs/flutter-apk/
          retention-days: 30