name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd flutter_quest
          flutter pub get

      - name: Run tests
        run: |
          cd flutter_quest
          flutter test

      - name: Build Release APK
        run: |
          cd flutter_quest
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_quest/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK (all ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-split
          path: flutter_quest/build/app/outputs/flutter-apk/
          retention-days: 30
